</style></head><body data-kind="service"><header><nav><a href="index.html">Главная</a><a href="about.html">О проекте</a><a href="contacts.html">Контакты</a></nav></header><main><h1>Мастерская Профи</h1><p>Простой расчёт примерной стоимости бытовой услуги.</p><section class="panel"><h2>Простая демонстрация</h2><label>Выберите услугу <select id="service"><option value="500">Мелкий ремонт — 500 ₽</option><option value="1000">Сборка мебели — 1000 ₽</option><option value="1500">Установка техники — 1500 ₽</option></select></label><label>Количество часов <input id="hours" type="number" value="1" min="1" max="8"></label><button id="go">Рассчитать</button><p id="result">Выберите услугу и количество часов.</p><p class="note">Учебный проект. Данные не передаются на сервер.</p></section></main><footer>Учебный веб-проект · HTML, CSS и JavaScript</footer><script>
"use strict";
// Находим элемент страницы по его номеру.
function el(id){return document.getElementById(id)}
const result=el("result");
// Добавление товара или блюда в простой список покупок.
document.querySelectorAll(".add").forEach(function(button){
 button.addEventListener("click",function(){
  const old=result.dataset.total?Number(result.dataset.total):0;
  const total=old+Number(button.dataset.price);
  result.dataset.total=total;
  result.textContent="Добавлено: "+button.dataset.name+". Сумма: "+total+" ₽";
 });
});
const go=el("go");
if(go)go.addEventListener("click",function(){
 const kind=document.body.dataset.kind;
 if(kind==="health"){
  result.textContent=el("person").value.trim()? "Заявка проверена для специалиста: "+el("doctor").value+". Запись не отправлена.":"Введите имя.";
 }else if(kind==="culture"){
  const count=Number(el("tickets").value);
  result.textContent=count>=1&&count<=10?"Стоимость билетов: "+(count*250)+" ₽":"Выберите от 1 до 10 билетов.";
 }else if(kind==="sport"){
  const weight=Number(el("weight").value),height=Number(el("height").value)/100;
  result.textContent=weight>0&&height>0?"Ваш ИМТ: "+(weight/(height*height)).toFixed(1):"Введите вес и рост.";
 }else if(kind==="service"){
  const hours=Number(el("hours").value),price=Number(el("service").value);
  result.textContent=hours>=1&&hours<=8?"Примерная стоимость: "+(hours*price)+" ₽":"Укажите от 1 до 8 часов.";
 }
});
// Простой поиск по списку проектов.
const search=el("search");
if(search)search.addEventListener("input",function(){
 let count=0;
 document.querySelectorAll("#projects li").forEach(function(item){
  const found=item.textContent.toLowerCase().includes(search.value.toLowerCase());
  item.hidden=!found;
  if(found)count++;
 });
 result.textContent="Найдено проектов: "+count;
});
</script></body></html>
