</style></head><body data-kind="finance"><header><nav><a href="index.html">Главная</a><a href="about.html">О проекте</a><a href="contacts.html">Контакты</a></nav></header><main><h1>СеверФинанс</h1><p>Простой учебный калькулятор вклада.</p><section class="panel"><h2>Простая демонстрация</h2><label>Сумма вклада, ₽ <input id="amount" type="number" value="10000" min="1000"></label><label>Ставка в год, % <input id="rate" type="number" value="8" min="0" max="40"></label><label>Срок, месяцев <input id="months" type="number" value="12" min="1" max="60"></label><button id="go">Рассчитать</button><p id="result">Введите данные и нажмите кнопку.</p><p class="note">Учебный проект. Данные не передаются на сервер.</p></section></main><footer>Учебный веб-проект · HTML, CSS и JavaScript</footer><script>
"use strict";
// Находим элемент страницы по его номеру.
function el(id){return document.getElementById(id)}
const result=el("result");
document.querySelectorAll(".add").forEach(function(button){
 button.addEventListener("click",function(){
  const old=result.dataset.total?Number(result.dataset.total):0;
  const total=old+Number(button.dataset.price);
  result.dataset.total=total;
  result.textContent="Добавлено: "+button.dataset.name+". Сумма заказа: "+total+" ₽";
 });
});
const go=el("go");
if(go)go.addEventListener("click",function(){
 const kind=document.body.dataset.kind;
 if(kind==="finance"){
  const amount=Number(el("amount").value),rate=Number(el("rate").value),months=Number(el("months").value);
  if(amount<1000||rate<0||rate>40||months<1||months>60){result.textContent="Проверьте введённые значения.";return}
  result.textContent="Примерная сумма: "+(amount*Math.pow(1+rate/1200,months)).toFixed(2)+" ₽";
 }else if(kind==="transport"){
  const distance=Number(el("distance").value),price=Number(el("price").value);
  result.textContent=distance>0&&price>0?"Стоимость поездки: "+(distance*price)+" ₽":"Введите положительные числа.";
 }else if(kind==="social"){
  result.textContent=el("question").value.trim().length>=5?"Вопрос заполнен. Это демонстрация, отправка не выполняется.":"Напишите вопрос хотя бы из 5 символов.";
 }else if(kind==="education"){
  result.textContent="Вы выбрали курс: "+el("course").value+". Запись не выполняется.";
 }
});
</script></body></html>
